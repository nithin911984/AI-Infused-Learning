services:
  app:
    build: .
    container_name: scalergpt-app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000     # INTERNAL port - see the port trap below!
    depends_on:
      - chroma
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: scalergpt-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  chroma_data: